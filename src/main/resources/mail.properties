# SMTP settings for sending password-reset verification codes.
#
# Leave empty to run in "development mode" (the code is shown on screen
# instead of being emailed). Fill in real values to send emails.
#
# Gmail example (use an App Password, not your normal password):
#   mail.smtp.host=smtp.gmail.com
#   mail.smtp.port=587
#   mail.smtp.auth=true
#   mail.smtp.starttls.enable=true
#   mail.smtp.username=you@gmail.com
#   mail.smtp.password=your-app-password
mail.smtp.host=
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.smtp.username=
mail.smtp.password=
